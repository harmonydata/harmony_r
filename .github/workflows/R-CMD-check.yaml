# R-CMD-check workflow, based on the standard one at
# https://github.com/r-lib/actions/blob/v2/examples/check-standard.yaml
#
# Runs R CMD check on every push to master and develop, and on every pull
# request, across the platforms and R versions CRAN checks against.

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

# a new push to a branch supersedes the check that is already running on it
concurrency:
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # the test suite calls the Harmony API, so run those tests rather than
      # skipping them: they are what catches the API changing under the library
      NOT_CRAN: true

    steps:
      - uses: actions/checkout@v4

      # R CMD check wants pandoc to check README.md and NEWS.md
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
